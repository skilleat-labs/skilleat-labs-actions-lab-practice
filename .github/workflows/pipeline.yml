name: Lab3 파이프라인
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release
    steps:
      - uses: actions/checkout@v5
      - run: make test
      - run: make BUILD_TYPE=${{ matrix.build_type }}
      - name: 결과물 이름에 정보 넣기
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv build/app "build/app-${{ matrix.build_type }}-$SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.build_type }}    # 매트릭스마다 이름이 달라야 함
          path: build/app-*
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 모든 아티팩트 내려받기
        uses: actions/download-artifact@v4
        with:
          path: dist
      - run: |
          echo "## 산출물 목록" >> "$GITHUB_STEP_SUMMARY"
          find dist -type f | sort >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment: production        # ← 여기서 승인 대기
    permissions:
      contents: write            # 릴리스 생성 권한 (없으면 403)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist
          merge-multiple: true
      - name: Release 생성
        env:
          GH_TOKEN: $
        run: |
          gh release create "v0.${{ github.run_number }}" \
            --title "빌드 v0.${{ github.run_number }}" \
            --generate-notes \
            dist/*