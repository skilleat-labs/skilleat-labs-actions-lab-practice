name: Lab5 표준
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7        # ← 이게 있어야 .github/actions/build-app 을 찾을 수 있음
      - id: b
        uses: ./.github/actions/build-app
        with:
          build_type: Release
      - run: echo "산출물 크기 ${{ steps.b.outputs.size }} byte"